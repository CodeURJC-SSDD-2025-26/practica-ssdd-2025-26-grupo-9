services:
  db:
    image: mysql:8.0
    container_name: distribuidos-db
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-1234}
      - MYSQL_DATABASE=distribuidos
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-1234}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  utility-service:
    image: espidocker3/utility-service:latest
    container_name: distribuidos-utility-service
    ports:
      - "8080:8080"
    restart: unless-stopped

  app-service:
    image: espidocker3/app-service:latest
    container_name: distribuidos-app-service
    ports:
      - "8443:8443"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/distribuidos?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-1234}
      - UTILITY_SERVICE_URL=http://utility-service:8080
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data: